name: Validate Quests and Config

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate FTB Quest IDs and Dependencies
        run: python scripts/validate_quests.py

      - name: Validate public metadata against pack/pack.json
        run: python scripts/validate_metadata.py
