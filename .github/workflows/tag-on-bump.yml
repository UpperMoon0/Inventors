name: Tag on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'pack/pack.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: bash
        run: |
          v="$(jq -r .version pack/pack.json | tr -d '\r' | xargs)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tag if not already tagged
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          if git ls-remote --tags origin "$tag" | grep -q .; then
            echo "Tag $tag already exists, skipping."
          else
            git tag -a "$tag" -m "Inventors ${VERSION}"
            git push origin "$tag"
            echo "Pushed $tag - Release workflow will pick it up."
          fi
