name: Build and Publish Modpack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version override (defaults to pack/pack.json)
        required: false
        type: string
      release_type:
        description: CurseForge release channel
        required: true
        default: beta
        type: choice
        options: [alpha, beta, release]
      publish:
        description: Publish client and server files to CurseForge
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $pack = Get-Content pack/pack.json -Raw | ConvertFrom-Json
          $configured = $pack.version
          $requested = '${{ inputs.version }}'
          $version = if ([string]::IsNullOrWhiteSpace($requested)) { $configured } else { $requested }
          $requestedReleaseType = '${{ inputs.release_type }}'
          $releaseType = if ([string]::IsNullOrWhiteSpace($requestedReleaseType)) { $pack.releaseType } else { $requestedReleaseType }
          "value=$version" >> $env:GITHUB_OUTPUT
          "release_type=$releaseType" >> $env:GITHUB_OUTPUT

      - name: Build client and server archives
        shell: pwsh
        run: ./scripts/build_modpack.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Inventors-${{ steps.version.outputs.value }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Inventors v${{ steps.version.outputs.value }}
          body_path: changelog/${{ steps.version.outputs.value }}.md
          fail_on_unmatched_files: true
          files: dist/*.zip
          draft: false
          prerelease: ${{ steps.version.outputs.release_type != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: ./scripts/publish_curseforge.ps1 -Version '${{ steps.version.outputs.value }}' -ReleaseType '${{ steps.version.outputs.release_type }}' -SkipBuild
