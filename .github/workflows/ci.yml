name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build client and server archives
        shell: pwsh
        run: |
          $pack = Get-Content pack/pack.json -Raw | ConvertFrom-Json
          ./scripts/build_modpack.ps1 -Version $pack.version
