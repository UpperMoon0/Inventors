name: Other problem or feedback
description: Server pack issues, performance, documentation errors, UI oddities, or general beta feedback
labels: ["triage"]
body:
  - type: input
    id: version
    attributes:
      label: Inventors version
      description: From the CurseForge file name or pack/pack.json
      placeholder: "0.3.2"
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Server pack or dedicated server
        - Performance
        - Documentation (README, CurseForge page, in-game docs)
        - UI or text oddity
        - Suggestion / balance feedback
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and how to see it if it is reproducible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Link relevant logs from `logs/` or attach screenshots if useful.
